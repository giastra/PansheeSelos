<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanseheeSelos</title>
    <link rel="stylesheet" href="../css/index.css">
    
</head>

<body>

    <header>
        <img id="banner" src="https://yt3.googleusercontent.com/m1SzyKVgKouZbhQJ4CHBOV01Wu49QfwhxVTADuGgWHwV2yLobPOMhm5v6k8PrJx5poqF7fkKP44=w1707-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj">
    </header>

    <!-- ###################################################################################### -->

    <main>
        <section id="usuarios">
            <div>
            <input id="Conta_filtro" type="text">
            <button id="Add_conta">adicionar conta</button>
            </div>
            
            <div id="F_opcoes">
                <label class="filtros">
                    Numero de selos
                    <input type="checkbox" value="N_selos" d="dese">
                </label>
                
                <label class="filtros">
                    Ordem alfabetica
                    <input type="checkbox" value="O_alfa" d="dese">
                </label>
                
                <label class="filtros">
                    Data de criação
                    <input type="checkbox" value="D_cria" d="dese">
                </label>
            </div>

            <div id="D_contas">
                <div class="conta">
                    <div class="nomes">
                        <p id="nome">usuario</p>
                        <p id="zzz">usuario zzz</p>
                    </div>
                    <div class="selos">
                        <img class="selo_conta" src="https://tse3.mm.bing.net/th/id/OIP.AN7e9S2XLNHT-BYaqkxE6wAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">
                        <img class="selo_conta" src="https://tse3.mm.bing.net/th/id/OIP.AN7e9S2XLNHT-BYaqkxE6wAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">
                    </div>
                </div>
            </div>

        </section>

        <!-- ###################################################################################### -->

        <section id="selos">
            <div id="top_selos">
                <p>selos disponiveis</p>
                <button id="add_selo">adicionar selo</button>
            </div>

            <div id="D_selos">
                <img class="selos_prev" src="https://tse3.mm.bing.net/th/id/OIP.AN7e9S2XLNHT-BYaqkxE6wAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">
            </div>
        </section>
    </main>

</body>
</html>
